rootProject.name = 'Nightball'

include 'core', 'lwjgl3'

// The Android module needs an Android SDK. Include it only when one is configured,
// so the desktop build works on machines without the SDK.
def sdkFromEnv = System.getenv('ANDROID_HOME') ?: System.getenv('ANDROID_SDK_ROOT')
def localProps = file('local.properties')
if (sdkFromEnv != null || (localProps.exists() && localProps.text.contains('sdk.dir'))) {
    include 'android'
}
