import io.github.fourlastor.construo.Target

plugins {
    id 'io.github.fourlastor.construo' version '2.2.2'
}

apply plugin: 'application'

application {
    mainClass = 'com.nightball.lwjgl3.Lwjgl3Launcher'
}

dependencies {
    implementation project(':core')
    implementation "com.badlogicgames.gdx:gdx-backend-lwjgl3:$gdxVersion"
    implementation "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
}

// Single runnable jar: java -jar lwjgl3/build/libs/Nightball-<version>.jar
jar {
    archiveFileName = "${appName}-${project.version}.jar"
    dependsOn configurations.runtimeClasspath
    from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    exclude('META-INF/INDEX.LIST', 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA')
    manifest {
        attributes 'Main-Class': application.mainClass
    }
}

// Windows package with its own Java runtime: ./gradlew lwjgl3:packageWinX64
// Produces dist/Nightball-winX64.zip; players unzip it and run Nightball.exe.
construo {
    name.set('Nightball')
    humanName.set('Nightball')
    outputDir.set(rootProject.file('dist'))
    zipFolder.set("Nightball-${project.version}")
    jlink {
        // LWJGL uses sun.misc.Unsafe, which jdeps does not always report.
        modules.addAll('jdk.unsupported')
    }
    targets.configure {
        create('winX64', Target.Windows) {
            architecture.set(Target.Architecture.X86_64)
            // Same Java version as the build machine's JDK, since jlink runs from the host JDK.
            jdkUrl.set('https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21.0.12.1%2B1/OpenJDK21U-jdk_x64_windows_hotspot_21.0.12.1_1.zip')
            jdkSha256.set('f9d6e191ab098c0d416e7d588a24420a8621cd2f4720dab2459b8b7b2d2d8b4e')
        }
    }
}
